[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-cat-detector"
version = "1.0.0"
description = "A machine learning project that uses neural networks to detect deepfake cat images"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "androodo"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/androodo/Deepfake-Cat-Detector"
Repository = "https://github.com/androodo/Deepfake-Cat-Detector"

